[project]
name = "ArxivEmbedding"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "xmltodict",
    "polars",
    "toml",
    "tqdm",
    "loguru",
    "feedparser",
    "datasets",
    "huggingface-hub[hf_xet]",
    "pyarrow",
    "embed",
    "torch",
    "transformers<4.49",
    "numpy",
    "datetime", # stdlib, harmless placeholder if present
]

[tool.uv]
package = false
